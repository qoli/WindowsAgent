name: Publish Windows executable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]] || {
            echo "invalid release version: $version" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test runtime and release contracts
        run: |
          go test ./...
          (cd runtimes/tailscale-adapter && GODEBUG=http2client=0 go test -mod=readonly ./...)
          go run ./cmd/windows-action-check --rules-dir Rules
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build executable assets and release catalog
        run: >-
          ./scripts/build-windows-capture-agent.sh
          --output-dir "$PWD/.release"
          --version "${{ steps.version.outputs.value }}"
      - name: Publish individual release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .release/*.exe
          .release/windowsagent-release.json
          .release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "WindowsAgent ${{ steps.version.outputs.value }}"
