name: Publish Windows executable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-go-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]] || {
            echo "invalid release version: $version" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test runtime and release contracts
        run: |
          go test ./...
          (cd runtimes/tailscale-adapter && GODEBUG=http2client=0 go test -mod=readonly ./...)
          go run ./cmd/windows-action-check --rules-dir Rules
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build Go executable assets
        run: >-
          ./scripts/build-windows-capture-agent.sh
          --output-dir "$PWD/.release"
          --version "${{ steps.version.outputs.value }}"
          --skip-assist-gui
          --skip-catalog
      - uses: actions/upload-artifact@v4
        with:
          name: windows-go-executables
          path: .release/*.exe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-release:
    needs: build-go-artifacts
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: windows-go-executables
          path: .release
      - name: Validate version tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -cnotmatch '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$') {
            throw "invalid release version: $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Publish framework-dependent WinUI AssistGUI
        shell: pwsh
        run: |
          ./scripts/build-windows-assist-gui.ps1 `
            -OutputDir .release/assist-gui `
            -Version "${{ steps.version.outputs.value }}"
          Copy-Item .release/assist-gui/windows-assist-gui.exe .release/windows-assist-gui.exe
      - name: Verify complete release and generate metadata
        shell: pwsh
        run: |
          python scripts/verify-windows-pe-subsystem.py .release/windows-assist-gui.exe --expect gui
          python scripts/verify-windows-pe-subsystem.py .release/windows-assist-backend.exe --expect gui
          go run ./cmd/windows-release-catalog `
            --input-dir .release `
            --version "${{ steps.version.outputs.value }}" `
            --output-json .release/windowsagent-release.json `
            --output-sums .release/SHA256SUMS
      - name: Package AssistGUI bootstrap payload
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP "windows-assist-bootstrap"
          New-Item -ItemType Directory -Path $bootstrap -Force | Out-Null
          Copy-Item -Path .release/assist-gui/* -Destination $bootstrap -Recurse
          Copy-Item .release/windows-assist-backend.exe $bootstrap
          $archive = Join-Path $PWD ".release/windows-assist-gui.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $bootstrap,
            $archive,
            [IO.Compression.CompressionLevel]::Optimal,
            $false)
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $actual = @($zip.Entries | Where-Object { -not $_.FullName.EndsWith("/") } | ForEach-Object FullName | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $payloadRoot = (Resolve-Path .release/assist-gui).Path.TrimEnd("\")
          $expected = @(Get-ChildItem -LiteralPath $payloadRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring($payloadRoot.Length + 1).Replace("\", "/")
          })
          $expected += "windows-assist-backend.exe"
          $expected = @($expected | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "AssistGUI bootstrap ZIP does not match the framework-dependent GUI payload plus backend"
          }
      - name: Publish individual release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath .release -Filter *.exe | Sort-Object Name | ForEach-Object FullName
          )
          $assets += (Resolve-Path .release/windows-assist-gui.zip).Path
          $assets += (Resolve-Path .release/windowsagent-release.json).Path
          $assets += (Resolve-Path .release/SHA256SUMS).Path
          & gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --generate-notes `
            --title "WindowsAgent ${{ steps.version.outputs.value }}"
