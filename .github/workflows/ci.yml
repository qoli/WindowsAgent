name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: go test ./...
      - name: Check Action dependencies
        run: go run ./cmd/windows-action-check --rules-dir Rules
      - name: Test ScreenParser DirectML contract
        run: >-
          dotnet run
          --project runtimes/screenparser-directml/ScreenParser.DirectML.ContractTests/ScreenParser.DirectML.ContractTests.csproj
          --configuration Release
      - name: Test ScreenParser DirectML one-shot contract
        run: >-
          dotnet run
          --project tools/screenparser-directml-one-shot/ScreenParser.DirectML.OneShot.ContractTests/ScreenParser.DirectML.OneShot.ContractTests.csproj
          --configuration Release
      - name: Check ScreenParser build tools
        run: python3 -m py_compile tools/screenparser-model/export_onnx.py tools/screenparser-model/convert_fp16.py tools/screenparser-runtime/publish.py
      - name: Test Rule deployment packager
        run: python3 -m unittest scripts/tests/test_deploy_windows_rules.py

  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Vet Windows packages
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Prepare output directory
        run: mkdir -p .build
      - name: Build console executable
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -o .build/windows-capture-agent-console.exe
          ./cmd/windows-capture-agent
      - name: Build installable GUI executable
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -ldflags "-H=windowsgui"
          -o .build/windows-capture-agent.exe
          ./cmd/windows-capture-agent
      - name: Build persistent WGC worker
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -o .build/windows-wgc-worker.exe
          ./cmd/windows-wgc-worker
      - name: Verify capture-agent PE subsystems
        run: |
          python3 scripts/verify-windows-pe-subsystem.py .build/windows-capture-agent.exe --expect gui
          python3 scripts/verify-windows-pe-subsystem.py .build/windows-capture-agent-console.exe --expect console
          python3 scripts/verify-windows-pe-subsystem.py .build/windows-wgc-worker.exe --expect console
      - name: Build event stream executable
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -ldflags "-H=windowsgui"
          -o .build/windows-event-stream.exe
          ./cmd/windows-event-stream
      - name: Build Action dependency checker
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -o .build/windows-action-check.exe
          ./cmd/windows-action-check
      - name: Verify event-stream PE subsystem
        run: python3 scripts/verify-windows-pe-subsystem.py .build/windows-event-stream.exe --expect gui
      - name: Verify Action dependency checker PE subsystem
        run: python3 scripts/verify-windows-pe-subsystem.py .build/windows-action-check.exe --expect console
      - name: Publish ScreenParser DirectML runtime
        run: >-
          python3 tools/screenparser-runtime/publish.py
          --dotnet "$(command -v dotnet)"
          --output-dir "$PWD/.build/screenparser-directml"
