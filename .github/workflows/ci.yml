name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test ./...

  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Vet Windows packages
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Prepare output directory
        run: mkdir -p .build
      - name: Build console executable
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -o .build/windows-capture-agent.exe
          ./cmd/windows-capture-agent
      - name: Build GUI executable
        run: >-
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -ldflags "-H=windowsgui"
          -o .build/windows-capture-agent-background.exe
          ./cmd/windows-capture-agent
