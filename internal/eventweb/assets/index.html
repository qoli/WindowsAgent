<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WindowsAgent Live</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background:#090d12; color:#d8e1eb }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; padding:18px; background:radial-gradient(circle at top left,#172231 0,#090d12 42%) }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px }
    h1 { margin:0; font:600 18px/1.2 system-ui,sans-serif; letter-spacing:.02em }
    button,input { color:inherit; background:#111923; border:1px solid #2a3a4b; border-radius:7px; padding:8px 10px }
    button { cursor:pointer }
    .grid { display:grid; grid-template-columns:minmax(270px,360px) minmax(0,1fr); gap:14px }
    .panel { background:rgba(12,18,25,.92); border:1px solid #223041; border-radius:12px; overflow:hidden; box-shadow:0 12px 38px #0006 }
    .title { padding:10px 13px; border-bottom:1px solid #223041; color:#8da2b7; font-size:12px; text-transform:uppercase; letter-spacing:.08em }
    .osd { min-height:210px; padding:16px }
    .row { display:flex; align-items:center; gap:9px; margin-bottom:12px }
    .dot { width:10px; height:10px; border-radius:50%; background:#485566; flex:0 0 auto }
    .dot.live { background:#ff3b45; box-shadow:0 0 12px #ff3b4599; animation:blink 2s steps(1,end) infinite }
    .dot.done { background:#32d583 }.dot.failed { background:#ff3b45 }.dot.stopped { background:#8b98a8 }
    .capture { background:#2ed3e6 }.recording { background:#ffd84a }
    @keyframes blink { 50% { opacity:0 } }
    .action { font:600 16px/1.3 system-ui,sans-serif; word-break:break-word }
    .activity { padding:9px 0; border-top:1px solid #1d2936; font:13px/1.4 system-ui,sans-serif }
    .activity.warning { color:#ffd17a }.activity.error { color:#ff8b91 }
    .muted { color:#73879b }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; padding:10px; border-bottom:1px solid #223041 }
    .toolbar input { flex:1; min-width:160px }
    #events { height:calc(100vh - 128px); min-height:360px; overflow:auto; padding:8px 12px }
    .event { padding:9px 0; border-bottom:1px solid #182330; font-size:12px }
    .event-head { display:flex; gap:9px; color:#89a0b8 }
    .event-type { color:#7cd4fd }.event-stream { color:#b9a2ff }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; color:#9cadbd; margin:7px 0 0 }
    #status { font-size:12px; color:#90a4b8 }
    @media(max-width:760px){ body{padding:10px}.grid{grid-template-columns:1fr}#events{height:56vh} }
  </style>
</head>
<body>
  <header><h1>WindowsAgent Live</h1><div><span id="status">disconnected</span> <button id="token">Token</button></div></header>
  <main class="grid">
    <section class="panel"><div class="title">OSD Mirror</div><div class="osd" id="osd"></div></section>
    <section class="panel">
      <div class="title">Streaming Log</div>
      <div class="toolbar"><input id="filter" placeholder="filter stream, type, correlation…"><button id="pause">Pause</button><button id="clear">Clear</button></div>
      <div id="events"></div>
    </section>
  </main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { token: sessionStorage.getItem('windowsAgentWebToken') || '', cursor:'0', paused:false, queue:[], events:[], controller:null };
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const auth = () => ({Authorization:'Bearer '+state.token});
  function requestToken(){ const value=prompt('WindowsAgent Web bearer token',state.token); if(value!==null){state.token=value.trim();sessionStorage.setItem('windowsAgentWebToken',state.token);restart();} }
  function shortAction(id){ const parts=String(id||'').split('/'); return parts[parts.length-1]||'No active Action'; }
  async function pollOSD(){
    if(!state.token) return;
    try{
      const response=await fetch('/api/v1/osd',{headers:auth(),cache:'no-store'});
      if(response.status===401){$('status').textContent='unauthorized';return;}
      if(!response.ok) throw new Error('HTTP '+response.status);
      const data=await response.json(); state.cursor=maxCursor(state.cursor,data.cursor); renderOSD(data); $('status').textContent=data.streamConnected?'live · '+data.cursor:'degraded · '+data.cursor;
    }catch(error){$('status').textContent='offline · '+error.message;}
  }
  function renderOSD(data){
    const a=data.action||{}; const indicators=[];
    if(data.captureActive) indicators.push('<span class="dot capture"></span><span>Capture accepted</span>');
    if(data.recordingActive) indicators.push('<span class="dot recording"></span><span>Evidence recording</span>');
    const dot=a.visible?'<span class="dot '+escapeHTML(String(a.status||'').toLowerCase())+'"></span>':'<span class="dot"></span>';
    const activities=(a.activities||[]).map(x=>'<div class="activity '+escapeHTML(x.level)+'">'+escapeHTML(x.message)+'</div>').join('');
    $('osd').innerHTML=(indicators.length?'<div class="row">'+indicators.join(' ')+'</div>':'')+'<div class="row">'+dot+'<div class="action">'+escapeHTML(shortAction(a.actionId))+'</div></div>'+(a.visible?activities:'<div class="muted">Waiting for Action activity</div>');
  }
  function maxCursor(a,b){ try{return BigInt(a)>=BigInt(b)?String(a):String(b)}catch{return String(b||a||'0')} }
  function addEnvelope(envelope){ state.cursor=maxCursor(state.cursor,envelope.cursor); state.events.push(envelope); if(state.events.length>500)state.events.shift(); if(!state.paused)renderEvents(); }
  function renderEvents(){
    const query=$('filter').value.toLowerCase(); const rows=state.events.filter(x=>JSON.stringify(x.event).toLowerCase().includes(query)).slice(-250).reverse();
    $('events').innerHTML=rows.map(x=>{const e=x.event;return '<article class="event"><div class="event-head"><span>#'+escapeHTML(x.cursor)+'</span><span class="event-stream">'+escapeHTML(e.stream)+'</span><span class="event-type">'+escapeHTML(e.type)+'</span></div><pre>'+escapeHTML(JSON.stringify(e.payload,null,2))+'</pre></article>'}).join('');
  }
  async function loadRecent(){
    const start=BigInt(state.cursor)>100n?String(BigInt(state.cursor)-100n):'0'; const response=await fetch('/api/v1/events?after='+start+'&limit=100',{headers:auth(),cache:'no-store'}); if(!response.ok)throw new Error('replay HTTP '+response.status); const data=await response.json(); state.events=[];(data.events||[]).forEach(addEnvelope);state.cursor=maxCursor(state.cursor,data.nextCursor);
  }
  async function follow(){
    while(state.token){
      state.controller=new AbortController();
      try{
        const response=await fetch('/api/v1/events/stream?after='+encodeURIComponent(state.cursor),{headers:auth(),cache:'no-store',signal:state.controller.signal});
        if(!response.ok)throw new Error('stream HTTP '+response.status);
        const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
        while(true){const part=await reader.read();if(part.done)throw new Error('stream ended');buffer+=decoder.decode(part.value,{stream:true});let index;while((index=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,index);buffer=buffer.slice(index+1);if(line)addEnvelope(JSON.parse(line));}}
      }catch(error){if(error.name==='AbortError')return;$('status').textContent='reconnecting · '+state.cursor;await new Promise(resolve=>setTimeout(resolve,1000));}
    }
  }
  async function restart(){ if(state.controller)state.controller.abort(); if(!state.token){requestToken();return;} try{await pollOSD();await loadRecent();follow();}catch(error){$('status').textContent=error.message;} }
  $('token').onclick=requestToken;$('filter').oninput=renderEvents;$('pause').onclick=()=>{state.paused=!state.paused;$('pause').textContent=state.paused?'Resume':'Pause';if(!state.paused)renderEvents();};$('clear').onclick=()=>{state.events=[];renderEvents();};
  setInterval(pollOSD,500); restart();
})();
</script>
</body>
</html>
